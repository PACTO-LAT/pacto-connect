openapi: 3.1.0
info:
  title: Pacto Connect Gateway API
  version: 1.0.0
  description: |
    HTTP API for the Pacto Connect Gateway (BFF). This specification documents
    every publicly reachable route as implemented. Secret keys (sk_*) are issued
    via admin but are not used to authenticate incoming requests.

servers:
  - url: http://localhost:8787
    description: Local development
  - url: https://connect.pacto.example
    description: Production (example)

tags:
  - name: health
    description: Health checks
  - name: session
    description: Checkout session handshake
  - name: quote
    description: FX quotes
  - name: escrows
    description: Escrow lifecycle
  - name: subscriptions
    description: Recurring subscriptions
  - name: test
    description: Test-mode controls
  - name: webhooks
    description: Webhook ingress and admin
  - name: admin
    description: Key and merchant administration
  - name: risk
    description: Per-merchant velocity thresholds, counterparty lists, and risk decisions

components:
  securitySchemes:
    PublishableKey:
      type: apiKey
      in: header
      name: x-pacto-publishable-key
      description: |
        Publishable key (pk_test_* or pk_live_*). May also be sent as
        Authorization Bearer pk_* on routes that do not use Bearer for client secret.
        Requires a valid Origin or Referer header on /v1/* routes.
    ClientSecret:
      type: http
      scheme: bearer
      bearerFormat: clientSecret
      description: |
        Checkout session client secret (cs_*). Used together with publishable key
        in x-pacto-publishable-key header on escrow, subscription, and test routes.
    AdminToken:
      type: http
      scheme: bearer
      bearerFormat: adminToken
      description: Gateway admin token (GATEWAY_ADMIN_TOKEN).
    WebhookSignature:
      type: apiKey
      in: header
      name: Pacto-Signature
      description: HMAC signature for inbound webhook payloads.

