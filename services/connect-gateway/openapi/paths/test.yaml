/v1/test/escrows/{id}/dispute:
  post:
    operationId: testForceDispute
    summary: Force escrow into dispute (test mode)
    tags: [test]
    security:
      - PublishableKey: []
      - ClientSecret: []
    parameters:
      - $ref: '../components/parameters.yaml#/PublishableKeyHeader'
      - $ref: '../components/parameters.yaml#/OriginHeader'
      - $ref: '../components/parameters.yaml#/EscrowIdPath'
    requestBody:
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/TestDisputeRequest'
    responses:
      '200':
        description: Escrow disputed
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/EscrowResponse'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      '429':
        $ref: '../components/responses.yaml#/TooManyRequests'

