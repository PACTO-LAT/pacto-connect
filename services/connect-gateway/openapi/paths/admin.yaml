/admin/keys:
  get:
    operationId: listApiKeys
    summary: List API keys
    tags: [admin]
    security:
      - AdminToken: []
    responses:
      '200':
        description: API keys
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ApiKeyListResponse'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '503':
        $ref: '../components/responses.yaml#/ServiceUnavailable'
  post:
    operationId: createApiKey
    summary: Create an API key pair
    tags: [admin]
    security:
      - AdminToken: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/CreateApiKeyRequest'
    responses:
      '201':
        description: Key created
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ApiKeyCreatedResponse'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '503':
        $ref: '../components/responses.yaml#/ServiceUnavailable'

