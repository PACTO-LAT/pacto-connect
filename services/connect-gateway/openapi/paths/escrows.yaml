/v1/escrows/events:
  get:
    operationId: streamEscrowEvents
    summary: Stream escrow lifecycle events (SSE)
    tags: [escrows]
    security:
      - PublishableKey: []
      - ClientSecret: []
    parameters:
      - $ref: '../components/parameters.yaml#/PublishableKeyHeader'
      - $ref: '../components/parameters.yaml#/OriginHeader'
      - $ref: '../components/parameters.yaml#/LastEventIdHeader'
      - $ref: '../components/parameters.yaml#/EscrowEventsEscrowIdQuery'
      - $ref: '../components/parameters.yaml#/EscrowEventsCursorQuery'
    responses:
      '200':
        description: Server-sent events stream
        content:
          text/event-stream:
            schema:
              type: string
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '501':
        $ref: '../components/responses.yaml#/NotImplemented'
      '429':
        $ref: '../components/responses.yaml#/TooManyRequests'

/v1/escrows:
  post:
    operationId: createEscrow
    summary: Create an escrow
    tags: [escrows]
    security:
      - PublishableKey: []
      - ClientSecret: []
    parameters:
      - $ref: '../components/parameters.yaml#/PublishableKeyHeader'
      - $ref: '../components/parameters.yaml#/OriginHeader'
      - $ref: '../components/parameters.yaml#/IdempotencyKeyHeader'
      - $ref: '../components/parameters.yaml#/RequestIdHeader'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/CreateEscrowRequest'
    responses:
      '200':
        description: Escrow created
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/EscrowResponse'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      '501':
        $ref: '../components/responses.yaml#/NotImplemented'
      '429':
        $ref: '../components/responses.yaml#/TooManyRequests'
      '500':
        $ref: '../components/responses.yaml#/InternalError'

