name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run type-check
      - run: npm run build
      - run: npm run test

  e2e:
    runs-on: ubuntu-latest
    needs: build

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pacto
          POSTGRES_PASSWORD: pacto
          POSTGRES_DB: pacto_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://pacto:pacto@localhost:5432/pacto_e2e
      DIRECT_URL: postgresql://pacto:pacto@localhost:5432/pacto_e2e
      GATEWAY_ADMIN_TOKEN: ${{ secrets.E2E_ADMIN_TOKEN }}
      GATEWAY_SIGNING_SECRET: ${{ secrets.E2E_SIGNING_SECRET }}
      NODE_ENV: test
      TESTMODE_RELEASE_DELAY_MS: "500"
      WEBHOOK_BACKOFF_BASE_MS: "100"
      PORT: "8788"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build all packages (required before E2E)
        run: npm run build

      - name: Run database migrations
        working-directory: services/connect-gateway
        run: npx prisma migrate deploy

      - name: Install Playwright browsers
        working-directory: apps/e2e
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: "true"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 7
